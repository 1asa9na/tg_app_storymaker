name: Deploy

# develop → стейджинг, master → прод (после подтверждения в environment production).
# Повторная выкатка вручную: Actions → Deploy → Run workflow.
on:
  push:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Окружение
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment || (github.ref_name == 'master' && 'production' || 'staging') }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: infra/web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_REPO }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'master' && 'production' || 'staging') }}
    env:
      ENV_NAME: ${{ inputs.environment || (github.ref_name == 'master' && 'production' || 'staging') }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Deploy over SSH
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::warning::DEPLOY_HOST для окружения $ENV_NAME не задан — деплой пропущен (см. docs/SETUP.md)"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          target="$DEPLOY_USER@$DEPLOY_HOST"
          root=/opt/storymaker
          ssh "$target" "mkdir -p $root/app $root/edge"
          scp infra/app/docker-compose.yml "$target:$root/app/"
          scp infra/edge/docker-compose.yml infra/edge/Caddyfile "$target:$root/edge/"
          scp infra/scripts/deploy.sh infra/env.example "$target:$root/"
          printf '%s' "$GHCR_TOKEN" | ssh "$target" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh "$target" "$root/deploy.sh '$ENV_NAME' '$GITHUB_SHA'"
