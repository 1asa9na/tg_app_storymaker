# Демо-тайтл: неделя в новом городе. Формат описан в docs/TITLE_FORMAT.md.
name: Неделя в новом городе

time:
  slots:
    - { id: morning, name: Утро }
    - { id: day, name: День }
    - { id: evening, name: Вечер }
    - { id: night, name: Ночь }
  sleep_from: [evening, night]
  days: 7
  week: [пн, вт, ср, чт, пт, сб, вс]

resources:
  energy:
    name: Энергия
    start: 100
    max: 100
    # +1 каждые 6 минут: от нуля до полной примерно за 10 часов
    regen: { amount: 1, every_minutes: 6 }
  money:
    name: Деньги
    start: 50

stats:
  fitness: { name: Форма }
  charm: { name: Обаяние }

start:
  location: home

gifts:
  per_character_per_day: 1
  default_affection: 1
